name: Compile CSS

on:
  pull_request:
  push:
    branches:
      - emjot

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "2.7"
          bundler-cache: true
      - run: bundle exec rake test
